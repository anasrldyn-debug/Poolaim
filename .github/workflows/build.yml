name: Unzip and Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip project if zip file exists
      run: |
        if [ -f "PoolAimAndroid_live_source.zip" ]; then
          echo "Unzipping PoolAimAndroid_live_source.zip..."
          unzip -o PoolAimAndroid_live_source.zip
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        fi

    - name: Build APK with Gradle
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: PoolAim-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
